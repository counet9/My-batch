 if(/Lasagnes/i.test(title)) return ['Préchauffe le four à 190 °C. Émince l’oignon et l’ail et prépare les légumes.','Fais revenir l’oignon et l’ail dans une poêle. Ajoute '+pname.toLowerCase()+' et '+veg.toLowerCase(), 'Incorpore '+sauce.toLowerCase()+' et les assaisonnements. Laisse mijoter quelques minutes pour obtenir une garniture liée.','Dans un plat, alterne une fine couche de garniture, les feuilles de lasagne et le reste de la préparation. Termine avec le fromage si prévu.','Enfourne environ 30 à 35 minutes, jusqu’à ce que les pâtes soient tendres et le dessus doré. Laisse reposer puis répartis en 4 portions.'];
 if(/Gratin/i.test(title)) return ['Préchauffe le four à 190 °C. Détaille le brocoli en petits bouquets et fais-le précuire 4 à 5 minutes.','Fais cuire les pâtes dans de l’eau salée en retirant 2 minutes au temps indiqué. Égoutte-les.','Mélange les pâtes, le jambon, le brocoli et la crème. Assaisonne puis verse dans un plat allant au four.','Ajoute le fromage râpé et enfourne 20 à 25 minutes, jusqu’à ce que le dessus soit doré.','Laisse tiédir puis répartis en 4 portions.'];
 if(/Purée|pommes de terre & haricots|Boulettes de bœuf, purée/i.test(title)) return ['Épluche les pommes de terre, coupe-les en cubes et fais-les cuire 18 à 20 minutes dans l’eau salée.','Fais cuire '+pname.toLowerCase()+' à la poêle jusqu’à cuisson complète. Réserve au chaud.','Égoutte les pommes de terre et écrase-les avec un peu de lait, du sel, du poivre et de la muscade.','Prépare la sauce avec '+sauce.toLowerCase()+' et un peu d’eau ou de bouillon. Ajoute les légumes et laisse cuire jusqu’à ce qu’ils soient tendres.','Répartis la purée, la viande et les légumes dans 4 contenants.'];
 if(/Nouilles|Pâtes|Tagliatelles|Spaghetti|Penne|Fusilli|Gnocchis|Orzo/i.test(title)) return ['Fais bouillir une grande casserole d’eau salée. Prépare les légumes et coupe '+pname.toLowerCase()+' en morceaux réguliers.','Fais cuire '+starch.toLowerCase()+' selon le temps indiqué sur le paquet. Égoutte en conservant une petite louche d’eau de cuisson.','Dans une grande poêle, fais revenir l’oignon et l’ail dans l’huile. Ajoute '+pname.toLowerCase()+' et fais dorer jusqu’à cuisson complète.','Ajoute '+veg.toLowerCase()+' puis '+sauce.toLowerCase()+' et '+spice+'. Détends la sauce avec un peu d’eau de cuisson si nécessaire.','Ajoute '+starch.toLowerCase()+' dans la poêle, mélange soigneusement et répartis en 4 portions.'];
 if(/couscous|semoule/i.test(title)) return ['Coupe '+pname.toLowerCase()+' et '+veg.toLowerCase()+' en morceaux réguliers. Émince l’oignon et l’ail.','Fais dorer la viande dans une poêle avec l’huile et les épices. Ajoute les légumes et laisse cuire jusqu’à ce qu’ils soient tendres.','Fais chauffer le bouillon. Verse-le sur la semoule, couvre 5 minutes puis égrène à la fourchette.','Ajoute '+sauce.toLowerCase()+' à la poêlée, mélange et rectifie l’assaisonnement.','Répartis la semoule et la préparation dans 4 portions.'];
 if(/riz|Bowl|Chili|Curry/i.test(title)) return ['Rince le riz si nécessaire puis fais-le cuire dans une casserole d’eau selon les indications du paquet. Égoutte et réserve.','Émince l’oignon et l’ail. Coupe '+pname.toLowerCase()+' et '+veg.toLowerCase()+' en morceaux réguliers.','Fais chauffer l’huile dans une grande poêle. Fais revenir l’oignon et l’ail, ajoute la viande et fais-la cuire à cœur.','Ajoute '+veg.toLowerCase()+', '+sauce.toLowerCase()+' et '+spice+'. Laisse mijoter jusqu’à ce que les légumes soient tendres et la sauce nappante.','Répartis le riz et la préparation dans 4 portions, laisse refroidir rapidement puis ferme les contenants.'];
 return ['Prépare les ingrédients : coupe '+pname.toLowerCase()+' en morceaux réguliers, détaille '+veg.toLowerCase()+' et hache l’oignon et l’ail.','Fais chauffer l’huile dans une grande poêle. Fais revenir l’oignon et l’ail, puis ajoute '+pname.toLowerCase()+'. Fais dorer et cuis à cœur.','Ajoute '+veg.toLowerCase()+' et '+spice+'. Fais cuire en remuant régulièrement jusqu’à ce que les légumes soient tendres.','Incorpore '+sauce.toLowerCase()+'. Ajoute un petit peu d’eau si besoin et laisse mijoter quelques minutes pour lier la sauce.','Prépare '+starch.toLowerCase()+' selon les indications du paquet, puis répartis la base et la garniture en 4 portions. Laisse refroidir rapidement avant de fermer les contenants.'];
}

const state={view:'home',search:'',filter:'Toutes',showFav:false,batch:[],checked:{},cookDone:{},activeRecipe:null,cookIndex:0,showModal:null};
const KEY='monBatch_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};Object.assign(state,saved);state.batch=(state.batch||[]).map(b=>{if(b.people&&b.days)return b;return {...b,people:2,days:1,portions:2}});
function persist(){const x={batch:state.batch,checked:state.checked,cookDone:state.cookDone,favorites:state.favorites||[],custom:state.custom||[]};localStorage.setItem(KEY,JSON.stringify(x))}
function allRecipes(){return recipes.concat(state.custom||[])}function recipePhoto(r){if(r.photo)return r.photo;let i=r.category==='Poisson'?1:r.category==='Porc'?11:r.category==='Bœuf'?2:r.category==='Asiatique'?0:r.category==='Végétarien'?18:14;return PHOTO_DATA[i]}function fav(r){return (state.favorites||[]).includes(r.id)}function fmt(n){return Math.round(n*10)/10}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(view){state.view=view;state.search='';render()}function toggleFav(id){state.favorites=state.favorites||[];state.favorites=fav(allRecipes().find(r=>r.id===id))?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();render()}
function addBatch(id){let x=state.batch.find(b=>b.id===id);if(x){toast('Cette recette est déjà dans ton batch : modifie les personnes et les jours directement.');return;}state.batch.push({id,people:2,days:1,portions:2});persist();toast('Recette ajoutée : règle le nombre de personnes et de jours.');}
function removeBatch(id){state.batch=state.batch.filter(x=>x.id!==id);persist();render()}
function adjustBatch(id,key,d){let x=state.batch.find(b=>b.id===id);if(!x)return;x.people=x.people||2;x.days=x.days||Math.max(1,Math.round((x.portions||4)/2));x[key]=Math.max(1,Math.min(key==='people'?8:14,x[key]+d));x.portions=x.people*x.days;persist();render()}
function recipeCard(r){return `<article class="recipe"><div class="foodpic" style="background:${palette(r.id)}"><img src="${recipePhoto(r)}" alt="${esc(r.title)}" loading="lazy"><button class="favorite" aria-label="Favori" onclick="event.stopPropagation();toggleFav('${r.id}')">${fav(r)?'♥':'♡'}</button></div><div class="recipebody"><h3>${esc(r.title)}</h3><div class="tags"><span class="tag">${esc(r.category)}</span><span class="tag gold">⏱ ${r.time} min</span></div><div class="macros"><div class="macro"><b>${r.kcal}</b><small>kcal</small></div><div class="macro"><b>${r.protein}g</b><small>prot.</small></div><div class="macro"><b>${r.carbs}g</b><small>gluc.</small></div><div class="macro"><b>${r.fat}g</b><small>lip.</small></div></div><div class="recipefoot"><button class="btn secondary small" onclick="detail('${r.id}')">Voir recette</button><button class="btn small" onclick="addBatch('${r.id}');nav('batch')">+ Batch</button></div></div></article>`}
function palette(id){let n=(parseInt(String(id).replace(/\D/g,''))||1)%6;return ['linear-gradient(135deg,#fff0d9,#f4d3c5)','linear-gradient(135deg,#e7f0d7,#d9e8cf)','linear-gradient(135deg,#f9e7d5,#e8d1bd)','linear-gradient(135deg,#eee7ff,#dad1ff)','linear-gradient(135deg,#fce8eb,#f7d4d9)','linear-gradient(135deg,#e5eff5,#cddfea)'][n]}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modalback" onclick="if(event.target.id==='modalback')closeModal()"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modalback')?.remove()}
function detail(id){let r=allRecipes().find(x=>x.id===id);if(!r)return;state.activeRecipe=id;modal(`<div class="modalhead"><h2>${esc(r.title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="detailhero"><img src="${recipePhoto(r)}" alt="${esc(r.title)}"></div><div class="tags"><span class="tag">${esc(r.category)}</span><span class="tag gold">⏱ ${r.time} min</span><span class="tag">4 portions généreuses</span></div><div class="detailgrid" style="margin:16px 0"><div class="detailmacro"><b>${r.kcal}</b><span>kcal / grande portion</span></div><div class="detailmacro"><b>${r.protein} g</b><span>Protéines</span></div><div class="detailmacro"><b>${r.carbs} g</b><span>Glucides</span></div><div class="detailmacro"><b>${r.fat} g</b><span>Lipides</span></div></div><div class="sectionhead"><h2>Ingrédients</h2><span class="muted">pour 4 portions généreuses</span></div><div class="ingredientslist">${r.ingredients.map(x=>`<div class="ingredientline"><span>${esc(x.name)}</span><b>${fmt(x.qty)} ${esc(x.unit)}</b></div>`).join('')}</div><div class="sectionhead"><h2>Préparation</h2></div><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="tiny">Conservation : ${esc(r.storage)}<br>Valeurs nutritionnelles estimées par grande portion, à ajuster selon les marques et produits utilisés.</p><div class="inlineactions"><button class="btn" onclick="addBatch('${r.id}');closeModal();nav('batch')">Ajouter au batch</button><button class="btn secondary" onclick="toggleFav('${r.id}');closeModal();detail('${r.id}')">${fav(r)?'Retirer des favoris':'Ajouter aux favoris'}</button></div>`)}
function home(){let total=state.batch.length;return `<div class="hero"><div><h1>Ton batch cooking,<br>en toute simplicité.</h1><p>Des plats chauds, gourmands et protéinés. Tu choisis, on calcule les quantités et les courses.</p><button class="btn light" onclick="nav('recipes')">Explorer les recettes　→</button></div><div class="herofood">🥘</div></div><div class="stats"><div class="stat"><strong>${allRecipes().length}</strong><span>recettes disponibles</span></div><div class="stat"><strong>${total}</strong><span>recettes dans ton batch</span></div><div class="stat"><strong>${(state.favorites||[]).length}</strong><span>favoris</span></div></div><div class="sectionhead"><h2>Ton espace cuisine</h2></div><div class="quickgrid"><button class="quick" onclick="nav('recipes')"><span class="emoji">📚</span><strong>Découvrir les recettes</strong><small>Parcourir le catalogue et tes favoris</small></button><button class="quick" onclick="nav('batch')"><span class="emoji">🛒</span><strong>Préparer mon batch cooking</strong><small>${total?total+' recette(s) sélectionnée(s)':'Sélectionner tes plats et générer les courses'}</small></button><button class="quick" onclick="openAdd()"><span class="emoji">✍️</span><strong>Ajouter une recette</strong><small>Importer tes idées ou celles de ta famille</small></button></div><div class="sectionhead"><h2>Quelques idées pour toi</h2><button class="btn secondary small" onclick="nav('recipes')">Tout voir</button></div><div class="grid">${[recipes[0],recipes[2],recipes[16]].map(recipeCard).join('')}</div>`}
function recipesPage(){let list=allRecipes().filter(r=>(!state.showFav||fav(r))&&(state.filter==='Toutes'||r.category===state.filter)&&(r.title.toLowerCase().includes(state.search.toLowerCase())||r.category.toLowerCase().includes(state.search.toLowerCase())));return `<div class="sectionhead"><div><h2>${state.showFav?'Mes favoris':'Toutes les recettes'}</h2><div class="tiny">${list.length} recette(s) · quantités de base pour 4 portions généreuses</div></div><button class="btn small" onclick="openAdd()">＋ Ajouter</button></div><div class="toolbar"><input class="search" placeholder="Rechercher un plat, un ingrédient..." value="${esc(state.search)}" oninput="state.search=this.value;refreshRecipes()"><button class="btn ${state.showFav?'':'secondary'} small" onclick="state.showFav=!state.showFav;render()">♥ Favoris</button></div><div class="tabs" style="margin:13px 0">${categories.map(c=>`<button class="tab ${state.filter===c?'active':''}" onclick="state.filter='${c}';render()">${c}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(recipeCard).join('')}</div>`:`<div class="empty">Aucune recette trouvée.<br><button class="btn secondary small" style="margin-top:12px" onclick="state.filter='Toutes';state.showFav=false;state.search='';render()">Réinitialiser les filtres</button></div>`}<p class="footnote">Les recettes de départ sont des versions adaptées créées pour cette application. Elles ne reproduisent pas nécessairement les fiches originales de Basta. Tu peux les modifier ou ajouter tes propres recettes.</p>`}
function refreshRecipes(){let field=document.querySelector('.search');let pos=window.scrollY;let cursor=field?field.selectionStart:null;render();let next=document.querySelector('.search');if(next){next.focus();if(cursor!==null)next.setSelectionRange(cursor,cursor)}window.scrollTo(0,pos)}
function batchIngredients(){let map=new Map();for(let b of state.batch){let r=allRecipes().find(x=>x.id===b.id);if(!r)continue;let factor=b.portions/4;for(let x of r.ingredients){let key=x.name.toLowerCase()+'|'+x.unit;let z=map.get(key)||{...x,qty:0,ids:[]};z.qty+=x.qty*factor;z.ids.push(r.title);map.set(key,z)}}return [...map.values()].sort((a,b)=>a.group.localeCompare(b.group,'fr')||a.name.localeCompare(b.name,'fr'))}
function batchPage(){let count=state.batch.reduce((a,b)=>a+(b.people||2)*(b.days||Math.max(1,Math.round((b.portions||4)/2))),0);if(!state.batch.length)return `<div class="sectionhead"><h2>Mon batch cooking</h2></div><div class="empty"><div style="font-size:48px">🍱</div><h3>Ton batch cooking est vide</h3><p>Choisis les recettes que tu souhaites préparer pour les prochains soirs.</p><button class="btn" onclick="nav('recipes')">Choisir mes recettes</button></div>`;let list=batchIngredients();let groups=[...new Set(list.map(x=>x.group))];return `<div class="sectionhead"><div><h2>Mon batch cooking</h2><div class="tiny">${state.batch.length} recette(s) · ${count} grandes portions au total</div></div><button class="btn secondary small" onclick="nav('recipes')">＋ Ajouter un plat</button></div><div class="panel"><h3 style="margin:0 0 4px">Mes recettes sélectionnées</h3>${state.batch.map(b=>{let r=allRecipes().find(x=>x.id===b.id);let people=b.people||2,days=b.days||1;return r?`<div class="batchrow"><div><b>${esc(r.title)}</b><div class="tiny">${r.kcal} kcal · ${r.protein} g protéines / grande portion</div><div class="tiny"><b>${people} personne(s) × ${days} jour(s) = ${people*days} grandes portions</b></div></div><div class="batchadjust"><div class="batchadjustrow"><small>Pers.</small><div class="qty"><button aria-label="Moins de personnes" onclick="adjustBatch('${r.id}','people',-1)">−</button><b>${people}</b><button aria-label="Plus de personnes" onclick="adjustBatch('${r.id}','people',1)">＋</button></div></div><div class="batchadjustrow"><small>Jours</small><div class="qty"><button aria-label="Moins de jours" onclick="adjustBatch('${r.id}','days',-1)">−</button><b>${days}</b><button aria-label="Plus de jours" onclick="adjustBatch('${r.id}','days',1)">＋</button></div></div></div><button class="iconbtn remove" onclick="removeBatch('${r.id}')">Retirer</button></div>`:''}).join('')}<div class="footnote">Par défaut : 2 personnes pendant 1 jour, soit 2 grandes portions par recette. Tu peux choisir librement le nombre de personnes et de jours pour chaque recette. Ajuste les personnes et les jours : les ingrédients et la liste de courses se recalculent automatiquement.</div></div><div class="sectionhead"><div><h2>Liste de courses</h2><div class="tiny">${list.length} ingrédients regroupés automatiquement</div></div><button class="btn secondary small" onclick="copyShopping()">Copier</button></div><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Ma liste de courses</b><span class="tiny">${Object.values(state.checked).filter(Boolean).length}/${list.length} cochés</span></div><div class="progress"><span style="width:${list.length?100*list.filter(x=>state.checked[ingKey(x)]).length/list.length:0}%"></span></div>${groups.map(g=>`<div class="ingredientgroup"><h3>${esc(g)}</h3>${list.filter(x=>x.group===g).map(x=>{let k=ingKey(x),ck=!!state.checked[k];return `<div class="ingredient ${ck?'checked':''}"><input type="checkbox" ${ck?'checked':''} onchange="checkIngredient('${encodeURIComponent(k)}',this.checked)"><label>${esc(x.name)}</label><strong>${fmt(x.qty)} ${esc(x.unit)}</strong></div>`}).join('')}</div>`).join('')}</div><div class="inlineactions" style="margin-top:16px"><button class="btn" onclick="startCooking()">Passer en mode cuisine →</button><button class="btn outline" onclick="resetChecks()">Réinitialiser les courses</button></div>`}
function ingKey(x){return x.name.toLowerCase()+'|'+x.unit}function checkIngredient(k,v){state.checked[decodeURIComponent(k)]=v;persist();render()}function resetChecks(){state.checked={};persist();render()}function copyShopping(){let txt='LISTE DE COURSES — MON BATCH\n'+batchIngredients().map(x=>x.group+'\n'+fmt(x.qty)+' '+x.unit+' — '+x.name).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée')).catch(()=>toast('Copie non disponible'));else toast('Copie non disponible dans ce navigateur')}
function startCooking(){state.view='cooking';state.cookIndex=0;state.cookDone=state.cookDone||{};render()}
function cookingPage(){if(!state.batch.length)return `<div class="empty"><h3>Aucun batch à préparer</h3><button class="btn" onclick="nav('recipes')">Choisir des recettes</button></div>`;let tasks=[];for(let b of state.batch){let r=allRecipes().find(x=>x.id===b.id);if(r)r.steps.forEach((s,i)=>tasks.push({id:r.id+'_'+i,recipe:r,step:s,index:i}))}let done=tasks.filter(x=>state.cookDone[x.id]).length;let current=tasks[state.cookIndex]||tasks.find(x=>!state.cookDone[x.id])||tasks[tasks.length-1];if(!current)return '';return `<div class="cookbanner"><div class="tiny" style="color:#ddd5ff">MODE CUISINE</div><h2>On passe aux fourneaux 👨‍🍳</h2><p style="margin:0;color:#e4deff">${done} étape(s) terminée(s) sur ${tasks.length}</p><div class="progress" style="background:#ffffff45;margin-top:12px"><span style="width:${100*done/tasks.length}%;background:#ffe7a0"></span></div></div><div class="sectionhead"><h2>${esc(current.recipe.title)}</h2><span class="tag gold">Étape ${current.index+1}/ ${current.recipe.steps.length}</span></div><div class="panel"><div class="cookmeta">${esc(current.recipe.category)} · ${current.recipe.time} min au total</div><label class="cookstep ${state.cookDone[current.id]?'done':''}"><input type="checkbox" ${state.cookDone[current.id]?'checked':''} onchange="toggleCook('${current.id}',this.checked)"><span class="cooktext">${esc(current.step)}</span></label><div class="timer"><span>⏱ Minuteur</span><input id="timerMinutes" type="number" min="1" max="180" value="5" aria-label="Durée en minutes"><button onclick="startTimer()">Démarrer</button><b id="timerDisplay"></b></div><div class="inlineactions" style="margin-top:15px"><button class="btn secondary" onclick="prevCook()">← Précédente</button><button class="btn" onclick="nextCook()">${state.cookIndex===tasks.length-1?'Terminer':'Étape suivante →'}</button></div></div><div class="sectionhead"><h2>Toutes les étapes</h2><span class="tiny">Coche au fur et à mesure</span></div><div class="panel">${tasks.map((t,i)=>`<label class="cookstep ${state.cookDone[t.id]?'done':''}" onclick="state.cookIndex=${i};render()"><input type="checkbox" ${state.cookDone[t.id]?'checked':''} onclick="event.stopPropagation()" onchange="toggleCook('${t.id}',this.checked)"><span><div class="cookmeta">${esc(t.recipe.title)} · Étape ${t.index+1}</div><span class="cooktext">${esc(t.step)}</span></span></label>`).join('')}</div><div class="inlineactions" style="margin-top:16px"><button class="btn outline" onclick="finishCooking()">Terminer ma session</button></div>`}
function toggleCook(id,v){state.cookDone[id]=v;persist();render()}function taskCount(){return state.batch.reduce((a,b)=>{let r=allRecipes().find(x=>x.id===b.id);return a+(r?r.steps.length:0)},0)}function prevCook(){state.cookIndex=Math.max(0,state.cookIndex-1);render()}function nextCook(){let n=taskCount();if(state.cookIndex>=n-1){finishCooking();return}state.cookIndex++;render()}function finishCooking(){if(confirm('Terminer cette session et vider le batch cooking ?')){state.batch=[];state.checked={};state.cookDone={};state.cookIndex=0;persist();nav('home');toast('Session terminée. Bon appétit !')}}
let timerHandle=null,timerRemaining=0;function startTimer(){let n=Number(document.getElementById('timerMinutes')?.value)||5;timerRemaining=Math.max(60,Math.min(10800,n*60));clearInterval(timerHandle);const out=document.getElementById('timerDisplay');const tick=()=>{let m=Math.floor(timerRemaining/60),sec=timerRemaining%60;if(out)out.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(timerRemaining<=0){clearInterval(timerHandle);timerHandle=null;toast('Minuteur terminé !');}timerRemaining--;};tick();timerHandle=setInterval(tick,1000)}
function openAdd(){modal(`<div class="modalhead"><h2>Ajouter une recette</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Ajoute une recette de famille ou une création personnelle. Les données seront sauvegardées sur cet appareil.</p><form onsubmit="saveRecipe(event)"><div class="field"><label>Nom de la recette *</label><input id="newtitle" required placeholder="Ex. Poulet crémeux aux champignons"></div><div class="formgrid"><div class="field"><label>Catégorie</label><select id="newcat"><option>Poulet</option><option>Volaille</option><option>Bœuf</option><option>Porc</option><option>Poisson</option><option>Végétarien</option><option>Asiatique</option></select></div><div class="field"><label>Photo (facultative)</label><input id="newphoto" type="file" accept="image/*"></div><div class="field"><label>Temps total (minutes)</label><input id="newtime" type="number" min="5" value="35"></div><div class="field"><label>Calories / grande portion</label><input id="newkcal" type="number" min="0" value="650"></div><div class="field"><label>Protéines (g)</label><input id="newprotein" type="number" min="0" value="40"></div><div class="field"><label>Glucides (g)</label><input id="newcarbs" type="number" min="0" value="70"></div><div class="field"><label>Lipides (g)</label><input id="newfat" type="number" min="0" value="20"></div></div><div class="field"><label>Ingrédients pour 4 portions généreuses * (un par ligne : quantité | unité | ingrédient | catégorie)</label><textarea id="newingredients" required placeholder="600 | g | Blanc de poulet | Viandes & poissons\n300 | g | Riz | Féculents\n200 | ml | Crème légère | Produits frais\n15 | ml | Huile d’olive | Épicerie & sauces"></textarea><div class="tiny">Catégories possibles : Viandes & poissons, Féculents, Fruits & légumes, Produits frais, Épicerie & sauces, Épices & condiments.</div></div><div class="field"><label>Étapes (une par ligne) *</label><textarea id="newsteps" required placeholder="Prépare et coupe les ingrédients.\nFais cuire le riz.\nFais dorer le poulet dans une poêle.\nAjoute la sauce et les légumes puis laisse mijoter.\nRépartis dans 4 portions et laisse refroidir."></textarea></div><div class="field"><label>Conservation</label><input id="newstorage" value="3 jours au réfrigérateur. Jusqu’à 3 mois au congélateur."></div><button class="btn" type="submit" style="width:100%">Enregistrer la recette</button></form>`)}
function fileToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveRecipe(e){e.preventDefault();let file=document.getElementById('newphoto')?.files?.[0];let photo='';if(file){if(file.size>1400000){toast('Photo trop lourde : choisis une image de moins de 1,4 Mo');return}try{photo=await fileToData(file)}catch(err){toast('Impossible de lire cette photo');return}}let lines=document.getElementById('newingredients').value.split('\n').map(x=>x.trim()).filter(Boolean),ingredients=[];for(let line of lines){let a=line.split('|').map(x=>x.trim());if(a.length<3||!Number.isFinite(Number(a[0]))){toast('Vérifie le format des ingrédients');return}ingredients.push({qty:Number(a[0]),unit:a[1],name:a[2],group:a[3]||'Épicerie & sauces'})}let steps=document.getElementById('newsteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ingredients.length||!steps.length){toast('Ajoute au moins un ingrédient et une étape');return}let r={id:'custom_'+Date.now(),photo,title:document.getElementById('newtitle').value.trim(),category:document.getElementById('newcat').value,time:Number(document.getElementById('newtime').value)||35,kcal:Number(document.getElementById('newkcal').value)||0,protein:Number(document.getElementById('newprotein').value)||0,carbs:Number(document.getElementById('newcarbs').value)||0,fat:Number(document.getElementById('newfat').value)||0,ingredients,steps,storage:document.getElementById('newstorage').value,source:'Recette personnelle'};state.custom=state.custom||[];state.custom.push(r);persist();closeModal();state.view='recipes';state.showFav=false;state.filter='Toutes';render();toast('Recette ajoutée au catalogue')}
function render(){let title={home:'Accueil',recipes:'Recettes',batch:'Mon batch',cooking:'Mode cuisine'}[state.view]||'Mon Batch';let content=state.view==='home'?home():state.view==='recipes'?recipesPage():state.view==='batch'?batchPage():cookingPage();document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="brandmark">🥘</span><span>MON BATCH</span></div><div class="topright"><button class="iconbtn" onclick="openAdd()">＋ Recette</button></div></header><main class="wrap">${content}</main><nav class="bottomnav"><button class="navbtn ${state.view==='home'?'active':''}" onclick="nav('home')"><span class="navicon">⌂</span>Accueil</button><button class="navbtn ${state.view==='recipes'?'active':''}" onclick="state.showFav=false;nav('recipes')"><span class="navicon">▦</span>Recettes</button><button class="navbtn ${state.view==='batch'?'active':''}" onclick="nav('batch')"><span class="navicon">🛒</span>Courses</button><button class="navbtn ${state.view==='cooking'?'active':''}" onclick="nav('cooking')"><span class="navicon">♨</span>Cuisine</button><button class="navbtn" onclick="state.showFav=true;state.view='recipes';render()"><span class="navicon">♥</span>Favoris</button></nav>`}
let toastTimer;function toast(s){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2200)}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
