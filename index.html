function makeSteps(x){
 const {title,pname,starch,veg,sauce,spice}=x;
 if(/Hachis parmentier/i.test(title)) return ['Épluche les pommes de terre, coupe-les en morceaux et fais-les cuire 18 à 20 minutes dans une grande casserole d’eau salée.','Pendant ce temps, fais revenir l’oignon, l’ail et les carottes coupées en petits dés dans une poêle avec un filet d’huile. Ajoute la viande hachée, assaisonne et fais cuire à cœur.','Égoutte les pommes de terre puis écrase-les avec le lait, le beurre, le sel, le poivre et la muscade pour obtenir une purée souple.','Étale la viande dans un plat allant au four, recouvre de purée puis ajoute le fromage râpé. Fais gratiner 15 à 20 minutes à 200 °C.','Laisse reposer quelques minutes, répartis en 4 portions et laisse refroidir rapidement avant de fermer les contenants.'];
 if(/Lasagnes/i.test(title)) return ['Préchauffe le four à 190 °C. Émince l’oignon et l’ail et prépare les légumes.','Fais revenir l’oignon et l’ail dans une poêle. Ajoute '+pname.toLowerCase()+' et '+veg.toLowerCase(), 'Incorpore '+sauce.toLowerCase()+' et les assaisonnements. Laisse mijoter quelques minutes pour obtenir une garniture liée.','Dans un plat, alterne une fine couche de garniture, les feuilles de lasagne et le reste de la préparation. Termine avec le fromage si prévu.','Enfourne environ 30 à 35 minutes, jusqu’à ce que les pâtes soient tendres et le dessus doré. Laisse reposer puis répartis en 4 portions.'];
 if(/Gratin/i.test(title)) return ['Préchauffe le four à 190 °C. Détaille le brocoli en petits bouquets et fais-le précuire 4 à 5 minutes.','Fais cuire les pâtes dans de l’eau salée en retirant 2 minutes au temps indiqué. Égoutte-les.','Mélange les pâtes, le jambon, le brocoli et la crème. Assaisonne puis verse dans un plat allant au four.','Ajoute le fromage râpé et enfourne 20 à 25 minutes, jusqu’à ce que le dessus soit doré.','Laisse tiédir puis répartis en 4 portions.'];
 if(/Purée|pommes de terre & haricots|Boulettes de bœuf, purée/i.test(title)) return ['Épluche les pommes de terre, coupe-les en cubes et fais-les cuire 18 à 20 minutes dans l’eau salée.','Fais cuire '+pname.toLowerCase()+' à la poêle jusqu’à cuisson complète. Réserve au chaud.','Égoutte les pommes de terre et écrase-les avec un peu de lait, du sel, du poivre et de la muscade.','Prépare la sauce avec '+sauce.toLowerCase()+' et un peu d’eau ou de bouillon. Ajoute les légumes et laisse cuire jusqu’à ce qu’ils soient tendres.','Répartis la purée, la viande et les légumes dans 4 contenants.'];
 if(/Nouilles|Pâtes|Tagliatelles|Spaghetti|Penne|Fusilli|Gnocchis|Orzo/i.test(title)) return ['Fais bouillir une grande casserole d’eau salée. Prépare les légumes et coupe '+pname.toLowerCase()+' en morceaux réguliers.','Fais cuire '+starch.toLowerCase()+' selon le temps indiqué sur le paquet. Égoutte en conservant une petite louche d’eau de cuisson.','Dans une grande poêle, fais revenir l’oignon et l’ail dans l’huile. Ajoute '+pname.toLowerCase()+' et fais dorer jusqu’à cuisson complète.','Ajoute '+veg.toLowerCase()+' puis '+sauce.toLowerCase()+' et '+spice+'. Détends la sauce avec un peu d’eau de cuisson si nécessaire.','Ajoute '+starch.toLowerCase()+' dans la poêle, mélange soigneusement et répartis en 4 portions.'];
 if(/couscous|semoule/i.test(title)) return ['Coupe '+pname.toLowerCase()+' et '+veg.toLowerCase()+' en morceaux réguliers. Émince l’oignon et l’ail.','Fais dorer la viande dans une poêle avec l’huile et les épices. Ajoute les légumes et laisse cuire jusqu’à ce qu’ils soient tendres.','Fais chauffer le bouillon. Verse-le sur la semoule, couvre 5 minutes puis égrène à la fourchette.','Ajoute '+sauce.toLowerCase()+' à la poêlée, mélange et rectifie l’assaisonnement.','Répartis la semoule et la préparation dans 4 portions.'];
 if(/riz|Bowl|Chili|Curry/i.test(title)) return ['Rince le riz si nécessaire puis fais-le cuire dans une casserole d’eau selon les indications du paquet. Égoutte et réserve.','Émince l’oignon et l’ail. Coupe '+pname.toLowerCase()+' et '+veg.toLowerCase()+' en morceaux réguliers.','Fais chauffer l’huile dans une grande poêle. Fais revenir l’oignon et l’ail, ajoute la viande et fais-la cuire à cœur.','Ajoute '+veg.toLowerCase()+', '+sauce.toLowerCase()+' et '+spice+'. Laisse mijoter jusqu’à ce que les légumes soient tendres et la sauce nappante.','Répartis le riz et la préparation dans 4 portions, laisse refroidir rapidement puis ferme les contenants.'];
 return ['Prépare les ingrédients : coupe '+pname.toLowerCase()+' en morceaux réguliers, détaille '+veg.toLowerCase()+' et hache l’oignon et l’ail.','Fais chauffer l’huile dans une grande poêle. Fais revenir l’oignon et l’ail, puis ajoute '+pname.toLowerCase()+'. Fais dorer et cuis à cœur.','Ajoute '+veg.toLowerCase()+' et '+spice+'. Fais cuire en remuant régulièrement jusqu’à ce que les légumes soient tendres.','Incorpore '+sauce.toLowerCase()+'. Ajoute un petit peu d’eau si besoin et laisse mijoter quelques minutes pour lier la sauce.','Prépare '+starch.toLowerCase()+' selon les indications du paquet, puis répartis la base et la garniture en 4 portions. Laisse refroidir rapidement avant de fermer les contenants.'];
}

const DETAIL_RECIPES = {"1":{"time":35,"kcal":1050,"protein":82,"carbs":142,"fat":19,"cost":5.4,"storage":"3 jours au réfrigérateur à 4 °C maximum. Congélation possible 2 mois ; décongeler au réfrigérateur et réchauffer avec 1 à 2 c. à s. d’eau.","ingredients":[[240,"g","Blanc de poulet"],[150,"g","Nouilles chinoises sèches"],[300,"g","Mélange de légumes pour wok"],[40,"ml","Sauce soja"],[10,"ml","Huile de sésame"],[10,"ml","Vinaigre de riz"],[12,"g","Maïzena"],[5,"g","Ail en poudre"],[4,"g","Gingembre en poudre"],[30,"g","Miel"],[200,"ml","Eau"],[10,"g","Graines de sésame"]],"steps":["5 min — Dans un bol, fouette l’eau, la sauce soja, le miel, le vinaigre de riz, la Maïzena, l’ail et le gingembre. Mélange jusqu’à disparition complète des grumeaux : cette sauce doit être prête avant la cuisson.","5 min — Coupe le poulet en lanières régulières de 1,5 cm. Éponge-les avec du papier absorbant pour favoriser une belle coloration.","5 min — Fais chauffer un grand wok à feu vif avec la moitié de l’huile de sésame. Fais saisir le poulet en une seule couche 2 min sans le remuer, puis retourne et cuis encore 2 à 3 min. Réserve-le sur une assiette : il terminera sa cuisson dans la sauce.","6 min — Ajoute le reste d’huile et les légumes encore surgelés. Fais-les sauter 5 à 6 min à feu vif ; ils doivent être chauds, colorés et encore légèrement croquants. Si le wok rend de l’eau, laisse-la s’évaporer avant de poursuivre.","4 min — Pendant ce temps, cuis les nouilles dans une grande casserole d’eau bouillante selon le paquet, en les gardant légèrement fermes. Égoutte-les soigneusement sans les rincer.","3 min — Baisse le feu du wok à moyen. Remue la sauce préparée dans le bol, verse-la sur les légumes et laisse bouillonner 1 à 2 min jusqu’à ce qu’elle devienne brillante et nappe la spatule.","3 min — Remets le poulet et son jus dans le wok. Fais cuire 2 à 3 min en remuant ; vérifie que le cœur du poulet atteint 74 °C ou n’est plus rosé.","2 min — Ajoute les nouilles et mélange délicatement 1 à 2 min pour les enrober sans les casser. Termine avec les graines de sésame."]},"2":{"time":65,"kcal":1120,"protein":72,"carbs":104,"fat":43,"cost":7.2,"storage":"3 jours au réfrigérateur. La texture reste meilleure sans congélation ; congélation possible 1 mois, mais la crème peut légèrement se séparer au réchauffage.","ingredients":[[150,"g","Saumon fumé"],[180,"g","Épinards frais"],[6,"pièce","Feuilles de lasagne sèches"],[250,"ml","Crème fraîche liquide"],[100,"g","Fromage frais ail et fines herbes"],[1,"pièce","Citron jaune"],[20,"g","Fromage râpé"],[1,"pièce","Oignon"],[10,"ml","Huile d’olive"],[1,"pincée","Noix de muscade"],[1,"pincée","Poivre noir"],[1,"pincée","Sel"]],"steps":["10 min — Préchauffe le four à 190 °C chaleur tournante. Émince l’oignon, coupe le saumon fumé en lanières et lave puis essore les épinards. Râpe finement le zeste du citron et presse la moitié.","5 min — Dans une petite casserole, chauffe doucement la crème avec le fromage frais, le zeste, 1 c. à s. de jus de citron, le poivre et une pincée de muscade. Fouette 3 à 4 min sans faire bouillir fort, jusqu’à obtenir une sauce homogène. Goûte avant de saler : le saumon fumé est déjà salé.","5 min — Dans une poêle, fais revenir l’oignon dans l’huile 3 min à feu moyen. Ajoute les épinards en deux fois et laisse-les tomber 2 min. Égoutte l’excédent d’eau si nécessaire, puis coupe le feu.","2 min — Incorpore le saumon fumé aux épinards hors du feu. Mélange brièvement ; il ne doit pas cuire longtemps à ce stade.","5 min — Étale une fine couche de sauce au fond d’un plat à gratin. Dispose une couche de feuilles de lasagne, puis une partie du mélange saumon-épinards et de la sauce.","5 min — Répète les couches en terminant par les feuilles recouvertes de sauce. Ajoute le fromage râpé sur le dessus. Les pâtes doivent être bien recouvertes de sauce pour cuire uniformément.","30 min — Enfourne à 190 °C pendant 25 à 30 min. La pointe d’un couteau doit traverser les feuilles sans résistance et le dessus doit être doré. Couvre de papier aluminium si le dessus colore trop vite.","10 min — Laisse reposer 10 min hors du four avant de découper : les couches se tiendront mieux. Répartis ensuite en parts généreuses."]},"3":{"time":45,"kcal":990,"protein":72,"carbs":118,"fat":24,"cost":4.8,"storage":"3 jours au réfrigérateur. Congélation possible 3 mois ; congèle le chili et le riz séparément pour préserver la texture.","ingredients":[[240,"g","Bœuf haché 5 %"],[100,"g","Haricots rouges égouttés"],[80,"g","Maïs égoutté"],[260,"g","Tomates concassées"],[40,"g","Concentré de tomate"],[100,"g","Riz cru"],[1,"pièce","Oignon"],[2,"gousse","Ail"],[1,"pièce","Poivron rouge"],[20,"ml","Huile d’olive"],[4,"g","Cumin moulu"],[4,"g","Paprika fumé"],[1,"g","Piment doux"],[100,"ml","Eau ou bouillon"],[20,"g","Fromage râpé"],[10,"g","Coriandre fraîche"],[1,"pincée","Sel"],[1,"pincée","Poivre noir"]],"steps":["8 min — Rince le riz jusqu’à ce que l’eau soit presque claire. Émince l’oignon, hache l’ail et coupe le poivron en petits dés. Égoutte et rince les haricots et le maïs.","15 min — Mets le riz dans une casserole avec 200 ml d’eau et une pincée de sel. Porte à ébullition, couvre, baisse au minimum et cuis 10 à 12 min selon le riz. Coupe le feu et laisse reposer 5 min à couvert.","6 min — Dans une cocotte chaude, fais revenir l’oignon et le poivron dans l’huile 4 min à feu moyen. Ajoute l’ail pendant les 30 dernières secondes sans le laisser brunir.","6 min — Ajoute le bœuf haché. Émiette-le à la spatule et fais-le dorer 5 à 6 min à feu moyen-vif jusqu’à ce qu’il ne reste plus de zones rouges.","2 min — Ajoute le concentré de tomate, le cumin, le paprika fumé et le piment. Fais torréfier 1 min en mélangeant pour développer les arômes.","12 min — Verse les tomates concassées et l’eau ou le bouillon. Mélange, couvre partiellement et laisse mijoter 10 min à feu doux ; la sauce doit réduire sans accrocher.","5 min — Ajoute les haricots et le maïs. Laisse chauffer 4 à 5 min. Goûte et ajuste sel, poivre et piment.","2 min — Répartis le riz et le chili dans les contenants. Ajoute le fromage râpé et la coriandre au moment de servir."]},"4":{"time":45,"kcal":1020,"protein":76,"carbs":112,"fat":27,"cost":6.7,"storage":"3 jours au réfrigérateur. Congélation possible 2 mois ; conserve la semoule à part et ajoute une cuillère d’eau avant de la réchauffer.","ingredients":[[250,"g","Rumsteck"],[100,"g","Semoule de couscous sèche"],[300,"g","Carottes"],[1,"pièce","Oignon"],[10,"g","Miel"],[4,"g","Cumin moulu"],[4,"g","Paprika doux"],[15,"ml","Huile d’olive"],[120,"ml","Bouillon de bœuf"],[10,"g","Beurre"],[1,"pincée","Sel"],[1,"pincée","Poivre noir"]],"steps":["8 min — Préchauffe le four à 200 °C. Épluche les carottes et coupe-les en bâtonnets de taille proche. Émince l’oignon et coupe le rumsteck en fines lanières perpendiculairement aux fibres.","3 min — Mélange les carottes avec 10 ml d’huile, le miel, la moitié du cumin, le paprika, du sel et du poivre. Étale-les en une seule couche sur une plaque.","25 min — Rôtis les carottes 22 à 25 min à 200 °C en les retournant à mi-cuisson. Elles doivent être tendres avec des bords caramélisés.","5 min — Porte le bouillon à ébullition. Verse-le sur la semoule dans un saladier, couvre 5 min puis égrène à la fourchette avec le beurre. Si elle paraît sèche, ajoute 1 à 2 c. à s. d’eau chaude.","4 min — Fais chauffer le reste d’huile dans une poêle très chaude. Saisis le bœuf en deux fois si nécessaire, 1 à 2 min par face ; ne surcharge pas la poêle pour éviter qu’il ne bouille.","4 min — Réserve le bœuf. Dans la même poêle, fais revenir l’oignon 3 min, ajoute le reste de cumin et déglace avec 60 ml de bouillon. Laisse réduire 1 min pour obtenir un jus parfumé.","2 min — Remets le bœuf dans la poêle hors du feu et mélange au jus. Répartis semoule, carottes rôties et bœuf dans les contenants."]},"5":{"time":35,"kcal":980,"protein":84,"carbs":108,"fat":20,"cost":4.9,"storage":"3 jours au réfrigérateur. Congélation possible 2 mois ; garde la sauce à part si tu veux conserver le poivron plus ferme.","ingredients":[[240,"g","Blanc de poulet"],[100,"g","Riz cru"],[200,"g","Poivron rouge et jaune"],[30,"ml","Sauce soja"],[10,"g","Miel"],[10,"ml","Huile d’olive"],[1,"gousse","Ail"],[5,"g","Gingembre frais"],[10,"ml","Jus de citron vert"],[10,"g","Graines de sésame"],[1,"pincée","Poivre noir"]],"steps":["12 min — Rince le riz, mets-le dans une casserole avec 200 ml d’eau et une pincée de sel. Porte à ébullition, couvre et cuis à feu très doux 10 à 12 min. Laisse reposer 5 min hors du feu.","5 min — Coupe le poulet en cubes de 2 à 3 cm. Émince les poivrons en lanières. Hache l’ail et râpe le gingembre.","2 min — Dans un bol, mélange la sauce soja, le miel, le jus de citron vert, l’ail et le gingembre. Prépare cette sauce avant la cuisson pour ne pas brûler le miel dans la poêle.","7 min — Fais chauffer l’huile dans une grande poêle à feu moyen-vif. Saisis le poulet 5 à 6 min en le retournant, jusqu’à ce qu’il soit doré et cuit à cœur (74 °C). Réserve-le.","6 min — Dans la même poêle, fais sauter les poivrons 5 à 6 min ; ils doivent rester légèrement croquants. Ajoute une cuillère à soupe d’eau si le fond colore trop.","3 min — Verse la sauce dans la poêle et laisse bouillonner 1 min. Remets le poulet et mélange 2 min, jusqu’à ce que les morceaux soient brillants et bien enrobés.","2 min — Répartis le riz dans les contenants, ajoute le poulet et les poivrons, puis parsème de graines de sésame."]},"6":{"time":40,"kcal":1010,"protein":82,"carbs":99,"fat":30,"cost":5.4,"storage":"3 jours au réfrigérateur. Congélation possible 2 mois ; la sauce coco peut épaissir, ajoute un peu d’eau au réchauffage.","ingredients":[[250,"g","Blanc de poulet"],[100,"g","Riz cru"],[250,"g","Haricots verts"],[150,"ml","Lait de coco"],[10,"g","Citronnelle finement hachée ou pâte de citronnelle"],[2,"gousse","Ail"],[10,"ml","Huile neutre"],[10,"ml","Sauce soja"],[80,"ml","Eau"],[10,"ml","Jus de citron v function ingredientGroup(name){
 const n=String(name).toLowerCase();
 if(/poulet|dinde|bœuf|boeuf|porc|saumon|thon|jambon|saucisse|steak|boulettes|viande hachée/.test(n)) return 'Viandes & poissons';
 if(/riz|semoule|nouilles|pâtes|penne|spaghetti|fusilli|tagliatelles|gnocchi|orzo|lasagne|pommes de terre|patate douce|lentilles|chapelure|farine/.test(n)) return 'Féculents';
 if(/crème|lait|fromage|parmesan|emmental|mozzarella|beurre|yaourt/.test(n)) return 'Produits frais';
 if(/carotte|courgette|aubergine|poivron|brocoli|épinard|tomate|oignon|ail|champignon|haricot|maïs|céleri|citron|échalote|coriandre|persil|basilic|menthe|aneth|légumes pour wok/.test(n)) return 'Fruits & légumes';
 if(/sel|poivre|paprika|cumin|origan|muscade|thym|gingembre|curry|épice|piment/.test(n)) return 'Épices & condiments';
 return 'Épicerie & sauces';
}

const state={view:'home',search:'',filter:'Toutes',showFav:false,batch:[],checked:{},cookDone:{},activeRecipe:null,cookIndex:0,showModal:null};
const KEY='monBatch_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};Object.assign(state,saved);state.batch=(state.batch||[]).map(b=>{let people=Math.max(1,Number(b.people)||2),days=Math.max(1,Number(b.days)||1);return {...b,people,days,portions:people*days}});
function persist(){const x={batch:state.batch,checked:state.checked,cookDone:state.cookDone,favorites:state.favorites||[],custom:state.custom||[]};localStorage.setItem(KEY,JSON.stringify(x))}
function allRecipes(){return recipes.concat(state.custom||[])}function recipeEmoji(r){return r.emoji||({'Poisson':'🐟','Bœuf':'🥩','Poulet':'🍗','Volaille':'🍗','Porc':'🥢','Végétarien':'🥦','Asiatique':'🍜'}[r.category]||'🍽️')}function recipeVisual(r,detail=false){if(r.photo)return `<img src="${r.photo}" alt="${esc(r.title)}" loading="lazy">`;return `<span class="${detail?'detailheroemoji':'bigemoji'}" role="img" aria-label="${esc(r.title)}">${recipeEmoji(r)}</span>`}function fav(r){return (state.favorites||[]).includes(r.id)}function fmt(n){return Math.round(n*10)/10}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(view){state.view=view;state.search='';render()}function toggleFav(id){state.favorites=state.favorites||[];state.favorites=fav(allRecipes().find(r=>r.id===id))?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();render()}
function addBatch(id){let x=state.batch.find(b=>b.id===id);if(x){toast('Cette recette est déjà dans ton batch : règle les personnes et les jours directement.');return;}state.batch.push({id,people:2,days:1,portions:2});persist();toast('Recette ajoutée : 2 personnes pour 1 dîner.');}
function removeBatch(id){state.batch=state.batch.filter(x=>x.id!==id);persist();render()}
function adjustBatch(id,key,d){let x=state.batch.find(b=>b.id===id);if(!x)return;x.people=x.people||2;x.days=x.days||1;x[key]=Math.max(1,Math.min(key==='people'?8:14,x[key]+d));x.portions=x.people*x.days;persist();render()}
function recipeCard(r){return `<article class="recipe"><div class="foodpic" style="background:${palette(r.id)}">${recipeVisual(r)}<button class="favorite" aria-label="Favori" onclick="event.stopPropagation();toggleFav('${r.id}')">${fav(r)?'♥':'♡'}</button></div><div class="recipebody"><h3>${esc(r.title)}</h3><div class="tags"><span class="tag">${esc(r.category)}</span><span class="tag gold">⏱ ${r.time} min</span></div><div class="macros"><div class="macro"><b>${r.kcal}</b><small>kcal</small></div><div class="macro"><b>${r.protein}g</b><small>prot.</small></div><div class="macro"><b>${r.carbs}g</b><small>gluc.</small></div><div class="macro"><b>${r.fat}g</b><small>lip.</small></div></div><div class="tiny" style="margin-top:8px">≈ ${Number.isFinite(Number(r.cost))?money(r.cost):'Prix à estimer'} / repas généreux</div><div class="recipefoot"><button class="btn secondary small" onclick="detail('${r.id}')">Voir recette</button><button class="btn small" onclick="addBatch('${r.id}');nav('batch')">+ Batch</button></div></div></article>`}
function palette(id){let n=(parseInt(String(id).replace(/\D/g,''))||1)%6;return ['linear-gradient(135deg,#fff0d9,#f4d3c5)','linear-gradient(135deg,#e7f0d7,#d9e8cf)','linear-gradient(135deg,#f9e7d5,#e8d1bd)','linear-gradient(135deg,#eee7ff,#dad1ff)','linear-gradient(135deg,#fce8eb,#f7d4d9)','linear-gradient(135deg,#e5eff5,#cddfea)'][n]}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modalback" onclick="if(event.target.id==='modalback')closeModal()"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modalback')?.remove()}
function detail(id){let r=allRecipes().find(x=>x.id===id);if(!r)return;state.activeRecipe=id;let own=String(r.id).startsWith('custom_');let serving=own?'4 portions (fiche personnelle)':'1 personne · 1 dîner (féculent renforcé)';let price=Number.isFinite(Number(r.cost))?`<div class="panel" style="margin:12px 0;padding:14px"><div class="sectionhead" style="margin:0"><div><b>Coût estimé</b><div class="tiny">Pour 1 dîner individuel · prix indicatif Belgique</div></div><strong style="font-size:22px;color:var(--navy)">${money(r.cost)}</strong></div><div class="tiny" style="margin-top:6px">Soit environ ${money(r.cost*2)} pour deux personnes sur un dîner. Estimation non contractuelle : marques, magasins et promotions peuvent faire varier le montant.</div></div>`:'';modal(`<div class="modalhead"><h2>${esc(r.title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="detailhero" style="background:${palette(r.id)}">${recipeVisual(r,true)}</div><div class="tags"><span class="tag">${esc(r.category)}</span><span class="tag gold">⏱ ${r.time} min</span><span class="tag">${esc(serving)}</span></div><div class="detailgrid" style="margin:16px 0"><div class="detailmacro"><b>${r.kcal}</b><span>kcal / grand repas</span></div><div class="detailmacro"><b>${r.protein} g</b><span>Protéines</span></div><div class="detailmacro"><b>${r.carbs} g</b><span>Glucides</span></div><div class="detailmacro"><b>${r.fat} g</b><span>Lipides</span></div></div>${price}<div class="sectionhead"><h2>Ingrédients</h2><span class="muted">${esc(serving)}</span></div><div class="ingredientslist">${r.ingredients.map(x=>`<div class="ingredientline"><span>${esc(x.name)}</span><b>${fmt(x.qty)} ${esc(x.unit)}</b></div>`).join('')}</div><div class="sectionhead"><h2>Préparation détaillée</h2><span class="muted">Temps indiqués à chaque étape</span></div><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="panel" style="margin:14px 0;padding:14px"><b>Conservation</b><p class="tiny" style="margin:7px 0 0">${esc(r.storage||'À conserver dans une boîte hermétique au réfrigérateur et à consommer sous 3 jours.')}</p></div><p class="tiny">Valeurs nutritionnelles estimées pour le repas indiqué. Elles varient selon les marques, les morceaux choisis et les quantités réellement utilisées. ${esc(r.source||'Recette personnelle')}.</p><div class="inlineactions"><button class="btn" onclick="addBatch('${r.id}');closeModal();nav('batch')">Ajouter au batch</button><button class="btn secondary" onclick="toggleFav('${r.id}');closeModal();detail('${r.id}')">${fav(r)?'Retirer des favoris':'Ajouter aux favoris'}</button></div>`)}
function home(){let total=state.batch.length;return `<div class="hero"><div><h1>Ton batch cooking,<br>en toute simplicité.</h1><p>Des plats chauds, gourmands et protéinés. Tu choisis, on calcule les quantités et les courses.</p><button class="btn light" onclick="nav('recipes')">Explorer les recettes　→</button></div><div class="herofood">🥘</div></div><div class="stats"><div class="stat"><strong>${allRecipes().length}</strong><span>recettes disponibles</span></div><div class="stat"><strong>${total}</strong><span>recettes dans ton batch</span></div><div class="stat"><strong>${(state.favorites||[]).length}</strong><span>favoris</span></div></div><div class="sectionhead"><h2>Ton espace cuisine</h2></div><div class="quickgrid"><button class="quick" onclick="nav('recipes')"><span class="emoji">📚</span><strong>Découvrir les recettes</strong><small>Parcourir le catalogue et tes favoris</small></button><button class="quick" onclick="nav('batch')"><span class="emoji">🛒</span><strong>Préparer mon batch cooking</strong><small>${total?total+' recette(s) sélectionnée(s)':'Sélectionner tes plats et générer les courses'}</small></button><button class="quick" onclick="openAdd()"><span class="emoji">✍️</span><strong>Ajouter une recette</strong><small>Importer tes idées ou celles de ta famille</small></button></div><div class="sectionhead"><h2>Quelques idées pour toi</h2><button class="btn secondary small" onclick="nav('recipes')">Tout voir</button></div><div class="grid">${[recipes[0],recipes[2],recipes[16]].map(recipeCard).join('')}</div>`}
function normalizeSearch(value){return String(value??'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ').replace(/[^a-z0-9]+/g,' ').trim()}
function recipeMatchesSearch(r,query){let q=normalizeSearch(query);if(!q)return true;let ignored=new Set(['et','de','du','des','la','le','les','un','une','avec','au','aux','a','d','en','pour','sur','dans','sans','ou']);let terms=q.split(/\s+/).filter(w=>w.length>1&&!ignored.has(w));if(!terms.length)return true;let searchable=normalizeSearch([r.title,r.category,...(r.ingredients||[]).map(x=>x.name),...(r.steps||[])].join(' '));return terms.every(term=>searchable.includes(term))}
function recipesPage(){let list=allRecipes().filter(r=>(!state.showFav||fav(r))&&(state.filter==='Toutes'||r.category===state.filter)&&recipeMatchesSearch(r,state.search));return `<div class="sectionhead"><div><h2>${state.showFav?'Mes favoris':'Toutes les recettes'}</h2><div class="tiny">${list.length} recette(s) · recherche par plat, ingrédient ou préparation</div></div><button class="btn small" onclick="openAdd()">＋ Ajouter</button></div><div class="recipe-search-panel"><label class="recipe-search-label" for="recipeSearchInput">Rechercher dans les plats</label><div class="recipe-search-row"><input id="recipeSearchInput" class="search recipe-search" type="search" autocomplete="off" aria-label="Rechercher une recette ou un ingrédient" placeholder="Ex. poulet miso, brocoli, riz…" value="${esc(state.search)}" oninput="state.search=this.value;refreshRecipes()">${state.search?`<button class="recipe-search-clear" type="button" aria-label="Effacer la recherche" onclick="state.search='';refreshRecipes()">Effacer</button>`:''}</div><small class="recipe-search-help">La recherche regarde aussi les ingrédients : essaie « miso », « brocoli » ou « riz ».</small></div><div class="toolbar"><button class="btn ${state.showFav?'':'secondary'} small" onclick="state.showFav=!state.showFav;render()">♥ ${state.showFav?'Voir toutes':'Favoris'}</button><button class="btn outline small" onclick="state.filter='Toutes';state.search='';state.showFav=false;render()">Tout afficher</button></div><div class="tabs" style="margin:13px 0">${categories.map(c=>`<button class="tab ${state.filter===c?'active':''}" onclick="state.filter='${c}';render()">${c}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(recipeCard).join('')}</div>`:`<div class="empty">Aucune recette trouvée pour « ${esc(state.search)} ».<br><button class="btn secondary small" style="margin-top:12px" onclick="state.filter='Toutes';state.showFav=false;state.search='';render()">Effacer les filtres</button></div>`}<p class="footnote">Les 19 premières recettes sont adaptées des captures que tu as fournies ; les autres ont été développées pour Mon Batch. Les 19 premières fiches reprennent les recettes de tes captures ; seuls les féculents sont renforcés pour vos grandes portions. Les autres sont des créations Mon Batch.</p>`}
function refreshRecipes(){let field=document.getElementById('recipeSearchInput');let pos=window.scrollY;let cursor=field?field.selectionStart:null;render();let next=document.getElementById('recipeSearchInput');if(next){next.focus();if(cursor!==null&&next.type!=='search')next.setSelectionRange(cursor,cursor);else if(cursor!==null){try{next.setSelectionRange(cursor,cursor)}catch(e){}}}window.scrollTo(0,pos)}
function batchFactor(b,r){let meals=Math.max(1,Number(b.people)||2)*Math.max(1,Number(b.days)||1);return String(r.id).startsWith('custom_')?meals/4:meals}
function batchIngredients(){let map=new Map();for(let b of state.batch){let r=allRecipes().find(x=>x.id===b.id);if(!r)continue;let factor=batchFactor(b,r);for(let x of r.ingredients){let key=x.name.toLowerCase()+'|'+x.unit;let z=map.get(key)||{...x,qty:0,ids:[]};z.qty+=x.qty*factor;z.ids.push(r.title);map.set(key,z)}}return [...map.values()].sort((a,b)=>a.group.localeCompare(b.group,'fr')||a.name.localeCompare(b.name,'fr'))}
function batchEstimatedCost(){return state.batch.reduce((sum,b)=>{let r=allRecipes().find(x=>x.id===b.id);if(!r||!Number.isFinite(Number(r.cost)))return sum;let multiplier=batchFactor(b,r);return sum+Number(r.cost)*multiplier},0)}
function batchPage(){if(!state.batch.length)return `<div class="sectionhead"><h2>Mon batch cooking</h2></div><div class="empty"><div style="font-size:48px">🍱</div><h3>Ton batch cooking est vide</h3><p>Choisis les recettes que tu souhaites préparer pour les prochains soirs.</p><button class="btn" onclick="nav('recipes')">Choisir mes recettes</button></div>`;let list=batchIngredients();let groups=[...new Set(list.map(x=>x.group))];return `<div class="sectionhead"><div><h2>Mon batch cooking</h2><div class="tiny">${state.batch.length} recette(s) sélectionnée(s) · réglages personnalisables pour chaque plat</div></div><button class="btn secondary small" onclick="nav('recipes')">＋ Ajouter un plat</button></div><div class="panel"><h3 style="margin:0 0 6px">Mes recettes sélectionnées</h3><p class="tiny" style="margin:0 0 10px">Choisis combien de personnes vont manger ce plat et pendant combien de jours.</p>${state.batch.map(b=>{let r=allRecipes().find(x=>x.id===b.id);let people=b.people||2,days=b.days||1;return r?`<div class="batchrow"><div class="batchtitle"><b>${esc(r.title)}</b><div class="tiny">${r.kcal} kcal · ${r.protein} g protéines · estimation indicative</div><div class="batchsummary">Pour <strong>${people}</strong> personne(s) pendant <strong>${days}</strong> jour(s) · ${people*days} repas généreux</div><div class="tiny">Budget estimé pour cette recette : <b>${Number.isFinite(Number(r.cost))?money(r.cost*people*days):'non disponible'}</b></div></div><div class="batchcontrols"><div class="batchcontrol"><span>Nombre de personnes</span><div class="qty"><button aria-label="Diminuer le nombre de personnes" onclick="adjustBatch('${r.id}','people',-1)">−</button><b>${people}</b><button aria-label="Augmenter le nombre de personnes" onclick="adjustBatch('${r.id}','people',1)">＋</button></div></div><div class="batchcontrol"><span>Nombre de jours</span><div class="qty"><button aria-label="Diminuer le nombre de jours" onclick="adjustBatch('${r.id}','days',-1)">−</button><b>${days}</b><button aria-label="Augmenter le nombre de jours" onclick="adjustBatch('${r.id}','days',1)">＋</button></div></div></div><button class="iconbtn remove" onclick="removeBatch('${r.id}')">Retirer</button></div>`:''}).join('')}<div class="footnote">Réglage initial : 2 personnes pour 1 dîner. Chaque quantité de recette correspond à 1 personne pour 1 dîner. Le calcul est strictement : quantité de base × nombre de personnes × nombre de jours. Aucun ingrédient n’est doublé automatiquement. Les féculents suivent tes portions généreuses ; les viandes, poissons, légumes et sauces gardent des quantités de recette cohérentes.</div></div><div class="sectionhead"><div><h2>Liste de courses</h2><div class="tiny">${list.length} ingrédients regroupés automatiquement</div></div><button class="btn secondary small" onclick="copyShopping()">Copier</button></div><div class="panel" style="margin-bottom:12px;padding:14px"><div class="tiny">Budget estimé pour l’ensemble du batch</div><strong style="font-size:24px;color:var(--navy)">${money(batchEstimatedCost())}</strong><div class="tiny">Calcul basé sur le coût estimé par grand repas et le nombre de personnes × jours. Prix indicatifs, non liés à un magasin précis.</div></div><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Ma liste de courses</b><span class="tiny">${Object.values(state.checked).filter(Boolean).length}/${list.length} cochés</span></div><div class="progress"><span style="width:${list.length?100*list.filter(x=>state.checked[ingKey(x)]).length/list.length:0}%"></span></div>${groups.map(g=>`<div class="ingredientgroup"><h3>${esc(g)}</h3>${list.filter(x=>x.group===g).map(x=>{let k=ingKey(x),ck=!!state.checked[k];return `<div class="ingredient ${ck?'checked':''}"><input type="checkbox" ${ck?'checked':''} onchange="checkIngredient('${encodeURIComponent(k)}',this.checked)"><label>${esc(x.name)}</label><strong>${fmt(x.qty)} ${esc(x.unit)}</strong></div>`}).join('')}</div>`).join('')}</div><div class="inlineactions" style="margin-top:16px"><button class="btn" onclick="startCooking()">Passer en mode cuisine →</button><button class="btn outline" onclick="resetChecks()">Réinitialiser les courses</button></div>`}
function ingKey(x){return x.name.toLowerCase()+'|'+x.unit}function checkIngredient(k,v){state.checked[decodeURIComponent(k)]=v;persist();render()}function resetChecks(){state.checked={};persist();render()}function copyShopping(){let txt='LISTE DE COURSES — MON BATCH\nBudget indicatif : '+money(batchEstimatedCost())+'\n\n'+batchIngredients().map(x=>x.group+'\n'+fmt(x.qty)+' '+x.unit+' — '+x.name).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée')).catch(()=>toast('Copie non disponible'));else toast('Copie non disponible dans ce navigateur')}
function startCooking(){state.view='cooking';state.cookIndex=0;state.cookDone=state.cookDone||{};render()}
function cookingPage(){if(!state.batch.length)return `<div class="empty"><h3>Aucun batch à préparer</h3><button class="btn" onclick="nav('recipes')">Choisir des recettes</button></div>`;let tasks=[];for(let b of state.batch){let r=allRecipes().find(x=>x.id===b.id);if(r)r.steps.forEach((s,i)=>tasks.push({id:r.id+'_'+i,recipe:r,step:s,index:i}))}let done=tasks.filter(x=>state.cookDone[x.id]).length;let current=tasks[state.cookIndex]||tasks.find(x=>!state.cookDone[x.id])||tasks[tasks.length-1];if(!current)return '';return `<div class="cookbanner"><div class="tiny" style="color:#ddd5ff">MODE CUISINE</div><h2>On passe aux fourneaux 👨‍🍳</h2><p style="margin:0;color:#e4deff">${done} étape(s) terminée(s) sur ${tasks.length}</p><div class="progress" style="background:#ffffff45;margin-top:12px"><span style="width:${100*done/tasks.length}%;background:#ffe7a0"></span></div></div><div class="sectionhead"><h2>${esc(current.recipe.title)}</h2><span class="tag gold">Étape ${current.index+1}/ ${current.recipe.steps.length}</span></div><div class="panel"><div class="cookmeta">${esc(current.recipe.category)} · ${current.recipe.time} min au total</div><p class="tiny">Les étapes reprennent la fiche de recette. Pour préparer tout ton batch, suis les quantités totales de la liste de courses (personnes × jours).</p><label class="cookstep" ${state.cookDone[current.id]?'done':''}"><input type="checkbox" ${state.cookDone[current.id]?'checked':''} onchange="toggleCook('${current.id}',this.checked)"><span class="cooktext">${esc(current.step)}</span></label><div class="timer"><span>⏱ Minuteur</span><input id="timerMinutes" type="number" min="1" max="180" value="${(String(current.step).match(/^(\d+)\s*min/i)||[])[1]||5}" aria-label="Durée en minutes"><button onclick="startTimer()">Démarrer</button><b id="timerDisplay"></b></div><div class="inlineactions" style="margin-top:15px"><button class="btn secondary" onclick="prevCook()">← Précédente</button><button class="btn" onclick="nextCook()">${state.cookIndex===tasks.length-1?'Terminer':'Étape suivante →'}</button></div></div><div class="sectionhead"><h2>Toutes les étapes</h2><span class="tiny">Coche au fur et à mesure</span></div><div class="panel">${tasks.map((t,i)=>`<label class="cookstep ${state.cookDone[t.id]?'done':''}" onclick="state.cookIndex=${i};render()"><input type="checkbox" ${state.cookDone[t.id]?'checked':''} onclick="event.stopPropagation()" onchange="toggleCook('${t.id}',this.checked)"><span><div class="cookmeta">${esc(t.recipe.title)} · Étape ${t.index+1}</div><span class="cooktext">${esc(t.step)}</span></span></label>`).join('')}</div><div class="inlineactions" style="margin-top:16px"><button class="btn outline" onclick="finishCooking()">Terminer ma session</button></div>`}
function toggleCook(id,v){state.cookDone[id]=v;persist();render()}function taskCount(){return state.batch.reduce((a,b)=>{let r=allRecipes().find(x=>x.id===b.id);return a+(r?r.steps.length:0)},0)}function prevCook(){state.cookIndex=Math.max(0,state.cookIndex-1);render()}function nextCook(){let n=taskCount();if(state.cookIndex>=n-1){finishCooking();return}state.cookIndex++;render()}function finishCooking(){if(confirm('Terminer cette session et vider le batch cooking ?')){state.batch=[];state.checked={};state.cookDone={};state.cookIndex=0;persist();nav('home');toast('Session terminée. Bon appétit !')}}
let timerHandle=null,timerRemaining=0;function startTimer(){let n=Number(document.getElementById('timerMinutes')?.value)||5;timerRemaining=Math.max(60,Math.min(10800,n*60));clearInterval(timerHandle);const out=document.getElementById('timerDisplay');const tick=()=>{let m=Math.floor(timerRemaining/60),sec=timerRemaining%60;if(out)out.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(timerRemaining<=0){clearInterval(timerHandle);timerHandle=null;toast('Minuteur terminé !');}timerRemaining--;};tick();timerHandle=setInterval(tick,1000)}
function openAdd(){modal(`<div class="modalhead"><h2>Ajouter une recette</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Ajoute une recette de famille ou une création personnelle. Les données seront sauvegardées sur cet appareil.</p><form onsubmit="saveRecipe(event)"><div class="field"><label>Nom de la recette *</label><input id="newtitle" required placeholder="Ex. Poulet crémeux aux champignons"></div><div class="formgrid"><div class="field"><label>Catégorie</label><select id="newcat"><option>Poulet</option><option>Volaille</option><option>Bœuf</option><option>Porc</option><option>Poisson</option><option>Végétarien</option><option>Asiatique</option></select></div><div class="field"><label>Photo (facultative)</label><input id="newphoto" type="file" accept="image/*"></div><div class="field"><label>Temps total (minutes)</label><input id="newtime" type="number" min="5" value="35"></div><div class="field"><label>Calories / grande portion</label><input id="newkcal" type="number" min="0" value="650"></div><div class="field"><label>Protéines (g)</label><input id="newprotein" type="number" min="0" value="40"></div><div class="field"><label>Glucides (g)</label><input id="newcarbs" type="number" min="0" value="70"></div><div class="field"><label>Lipides (g)</label><input id="newfat" type="number" min="0" value="20"></div></div><div class="field"><label>Ingrédients pour 4 portions généreuses * (un par ligne : quantité | unité | ingrédient | catégorie)</label><textarea id="newingredients" required placeholder="600 | g | Blanc de poulet | Viandes & poissons\n300 | g | Riz | Féculents\n200 | ml | Crème légère | Produits frais\n15 | ml | Huile d’olive | Épicerie & sauces"></textarea><div class="tiny">Catégories possibles : Viandes & poissons, Féculents, Fruits & légumes, Produits frais, Épicerie & sauces, Épices & condiments.</div></div><div class="field"><label>Étapes (une par ligne) *</label><textarea id="newsteps" required placeholder="Prépare et coupe les ingrédients.\nFais cuire le riz.\nFais dorer le poulet dans une poêle.\nAjoute la sauce et les légumes puis laisse mijoter.\nRépartis dans 4 portions et laisse refroidir."></textarea></div><div class="field"><label>Conservation</label><input id="newstorage" value="3 jours au réfrigérateur. Jusqu’à 3 mois au congélateur."></div><button class="btn" type="submit" style="width:100%">Enregistrer la recette</button></form>`)}
function fileToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveRecipe(e){e.preventDefault();let file=document.getElementById('newphoto')?.files?.[0];let photo='';if(file){if(file.size>1400000){toast('Photo trop lourde : choisis une image de moins de 1,4 Mo');return}try{photo=await fileToData(file)}catch(err){toast('Impossible de lire cette photo');return}}let lines=document.getElementById('newingredients').value.split('\n').map(x=>x.trim()).filter(Boolean),ingredients=[];for(let line of lines){let a=line.split('|').map(x=>x.trim());if(a.length<3||!Number.isFinite(Number(a[0]))){toast('Vérifie le format des ingrédients');return}ingredients.push({qty:Number(a[0]),unit:a[1],name:a[2],group:a[3]||'Épicerie & sauces'})}let steps=document.getElementById('newsteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ingredients.length||!steps.length){toast('Ajoute au moins un ingrédient et une étape');return}let r={id:'custom_'+Date.now(),photo,title:document.getElementById('newtitle').value.trim(),category:document.getElementById('newcat').value,time:Number(document.getElementById('newtime').value)||35,kcal:Number(document.getElementById('newkcal').value)||0,protein:Number(document.getElementById('newprotein').value)||0,carbs:Number(document.getElementById('newcarbs').value)||0,fat:Number(document.getElementById('newfat').value)||0,ingredients,steps,storage:document.getElementById('newstorage').value,source:'Recette personnelle'};state.custom=state.custom||[];state.custom.push(r);persist();closeModal();state.view='recipes';state.showFav=false;state.filter='Toutes';render();toast('Recette ajoutée au catalogue')}
function render(){let title={home:'Accueil',recipes:'Recettes',batch:'Mon batch',cooking:'Mode cuisine'}[state.view]||'Mon Batch';let content=state.view==='home'?home():state.view==='recipes'?recipesPage():state.view==='batch'?batchPage():cookingPage();document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="brandmark">🥘</span><span>MON BATCH <small style="font-size:10px;font-weight:700;opacity:.55;vertical-align:middle">V9</small></span></div><div class="topright"><button class="iconbtn" onclick="openAdd()">＋ Recette</button></div></header><main class="wrap">${content}</main><nav class="bottomnav"><button class="navbtn ${state.view==='home'?'active':''}" onclick="nav('home')"><span class="navicon">⌂</span>Accueil</button><button class="navbtn ${state.view==='recipes'?'active':''}" onclick="state.showFav=false;nav('recipes')"><span class="navicon">▦</span>Recettes</button><button class="navbtn ${state.view==='batch'?'active':''}" onclick="nav('batch')"><span class="navicon">🛒</span>Courses</button><button class="navbtn ${state.view==='cooking'?'active':''}" onclick="nav('cooking')"><span class="navicon">♨</span>Cuisine</button><button class="navbtn" onclick="state.showFav=true;state.view='recipes';render()"><span class="navicon">♥</span>Favoris</button></nav>`}
let toastTimer;function toast(s){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2200)}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!window.__monBatchV9Reloaded){window.__monBatchV9Reloaded=true;window.location.reload();}
  });
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await registration.update();
    }catch(error){console.warn('Mise à jour hors ligne non disponible :',error);}
  },{once:true});
}
</script></body></html>
